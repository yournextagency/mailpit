# Fork only: build the Your Next Agency image on every pushed tag (eg: v1.33.1-yna.1)
on:
  push:
    tags: [ 'v*' ]

name: Build YNA docker image
jobs:
  docker:
    if: github.repository == 'yournextagency/mailpit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log into GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: |
          "VERSION=${{ github.ref_name }}"
        push: true
        tags: |
          ghcr.io/yournextagency/mailpit:${{ github.ref_name }}
          ghcr.io/yournextagency/mailpit:latest
